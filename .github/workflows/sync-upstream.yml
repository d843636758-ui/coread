name: Sync upstream

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Open upstream sync PR
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream into a review branch
        env:
          UPSTREAM_REPO: meowmana/coread
          UPSTREAM_BRANCH: main
          SYNC_BRANCH: chore/sync-upstream
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream "${UPSTREAM_BRANCH}"
          git checkout -B "${SYNC_BRANCH}" origin/main
          git merge --no-edit "upstream/${UPSTREAM_BRANCH}"
          if git diff --quiet origin/main...HEAD; then
            echo "UPSTREAM_CHANGED=false" >> "${GITHUB_ENV}"
            exit 0
          fi
          git push --force-with-lease origin "${SYNC_BRANCH}"
          echo "UPSTREAM_CHANGED=true" >> "${GITHUB_ENV}"

      - name: Open or update pull request
        if: env.UPSTREAM_CHANGED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_BRANCH: chore/sync-upstream
        run: |
          set -euo pipefail
          existing_pr="$(gh pr list --state open --base main --head "${SYNC_BRANCH}" --json number --jq '.[0].number // empty')"
          if [ -z "${existing_pr}" ]; then
            gh pr create               --base main               --head "${SYNC_BRANCH}"               --title "chore: sync updates from meowmana/coread"               --body "Automated upstream sync. Review tests and deployment changes before merging."
          else
            gh pr edit "${existing_pr}"               --title "chore: sync updates from meowmana/coread"               --body "Automated upstream sync. Review tests and deployment changes before merging."
          fi
